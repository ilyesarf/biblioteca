version: '3'

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend/static:/usr/share/nginx/html/static
      - ./frontend/templates:/usr/share/nginx/html/
    ports:
      - "80:80"
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - ./api:/app
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=dbuser
      - DB_PASS=dbpass
      - DB_NAME=bibliotecadb
    ports:
      - "8000:8000"
    depends_on:
      - db
      - nanolock

  nanolock:
    build:
      context: ./nanolock
      dockerfile: Dockerfile
    volumes:
      - ./nanolock:/app
    ports:
      - "50051:50051"

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpass
      POSTGRES_DB: bibliotecadb
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

volumes:
  db:
  api:
  web:
  nanolock:
